
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarjeta de perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="pagina">
      <article class="tarjeta">
        <header class="tarjeta__cabecera">
          <div class="avatar">AM</div>
          <div class="tarjeta__info">
            <h1 class="tarjeta__nombre">Ana Martínez</h1>
            <p class="tarjeta__rol">Desarrolladora Full Stack</p>
          </div>
        </header>

        <section class="tarjeta__bio">
          <p>
            Apasionada por construir interfaces accesibles y código limpio.
            Actualmente aprendiendo Node.js y React.
          </p>
        </section>

        <ul class="tarjeta__skills">
          <li class="skill">HTML</li>
          <li class="skill">CSS</li>
          <li class="skill skill--destacado">JavaScript</li>
          <li class="skill">Git</li>
        </ul>

        <footer class="tarjeta__footer">
          <a href="#" class="enlace">GitHub</a>
          <a href="#" class="enlace">LinkedIn</a>
          <a href="#" class="enlace enlace--cta">Contactar</a>
        </footer>
      </article>
    </main>
  </body>
</html>
